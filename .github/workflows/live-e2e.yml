name: Live GitHub end-to-end

on:
  workflow_dispatch:
  push:
    branches: ["codex/live-e2e-*"]

concurrency:
  group: interprex-sandbox-live-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live-github:
    name: Read the shared sandbox through Interprex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Run sparse serialized live checks
        env:
          INTERPREX_LIVE_GITHUB: "1"
          INTERPREX_E2E_GH_TOKEN: ${{ secrets.POSTEL_E2E_GH_TOKEN }}
          INTERPREX_E2E_REPOSITORY: civitas-forge/interprex-sandbox
          INTERPREX_E2E_INTERVAL_SECONDS: "3"
        run: >-
          cargo test -p interprex-github --test live_github
          sandbox_repository_and_label_reads_follow_the_real_consumer_path --
          --ignored --exact --test-threads=1
